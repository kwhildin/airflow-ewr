<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AirFlow — Wait Times</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style-premium.css?v=p1" />
</head>
<body>
    <div class="bg-grid" aria-hidden="true"></div>
    <div class="bg-glow" aria-hidden="true"></div>

    <header class="topbar">
        <div class="container topbar-inner">
            <a class="brand" href="index.html" aria-label="AirFlow home">
                <img class="brand-logo" src="assets/airflow-logo.png" alt="AirFlow" width="160" height="42" decoding="async" />
            </a>

            <nav class="topnav" aria-label="Primary">
                <a class="topnav-link" href="index.html">Home</a>
                <a class="topnav-link" href="plan.html">Plan My Trip</a>
                <a class="topnav-link is-active" href="waits.html">Wait Times</a>
                <a class="topnav-link" href="about.html">About</a>
            </nav>

            <nav class="topnav topnav--right" aria-label="Account">
                <a class="topnav-link" href="saved.html">Saved</a>
                <a class="topnav-link" href="profile.html">Profile</a>
            </nav>
        </div>
    </header>

    <main class="container page">
        <section class="page-head page-head--row">
            <div>
                <h1 class="page-title">View Wait Times</h1>
                <p class="page-subtitle">See TSA and customs wait times by terminal, gate, and lane.</p>
                <p class="page-meta">Last updated <time id="last-updated" datetime="">—</time></p>
            </div>
            <div class="page-head-actions">
                <button type="button" class="btn btn-ghost" id="refresh-btn">Refresh</button>
            </div>
        </section>

        <section class="waits-list" id="wait-grid" role="list"></section>

        <section class="summary-strip" style="margin-top: 28px;">
            <div class="summary-item" style="width: 100%;">
                <p class="summary-k">Plan Ahead</p>
                <p class="page-subtitle">Estimate your wait time based on past data.</p>

                <form id="predict-form" style="display:grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-top: 18px;">
                    <input id="predict-date" type="date" required />
                    <input id="predict-time" type="time" required />

                    <select id="predict-terminal">
                        <option value="">Any Terminal</option>
                        <option value="A">Terminal A</option>
                        <option value="B">Terminal B</option>
                        <option value="C">Terminal C</option>
                    </select>

                    <select id="predict-lane">
                        <option value="">Any Lane</option>
                        <option value="Regular">Regular</option>
                        <option value="PreCheck">PreCheck</option>
                        <option value="US Passports">US Passports</option>
                        <option value="Visitors">Visitors With Visas</option>
                    </select>

                    <input id="predict-gate" placeholder="Gate optional, ex: 40-49" />

                    <button class="btn btn-ghost" type="submit">Predict Wait</button>
                </form>

                <p class="summary-v" id="prediction-result" style="margin-top: 18px;">—</p>
            </div>
        </section>
    </main>

    <script src="waits-sheet.js?v=207"></script>
</body>
</html>
