<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AirFlow — Profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style-premium.css?v=p1">
</head>
<body>
    <div class="bg-grid" aria-hidden="true"></div>
    <div class="bg-glow" aria-hidden="true"></div>

    <header class="topbar">
        <div class="container topbar-inner">
            <a class="brand" href="index.html" aria-label="AirFlow home">
                <img class="brand-logo" src="assets/airflow-logo.png" alt="AirFlow" width="160" height="42" decoding="async" />
            </a>

            <nav class="topnav" aria-label="Primary">
                <a class="topnav-link" href="index.html">Home</a>
                <a class="topnav-link" href="plan.html">Plan My Trip</a>
                <a class="topnav-link" href="waits.html">Wait Times</a>
                <a class="topnav-link" href="airport-map.html">Airport Map</a>
                <a class="topnav-link" href="about.html">About</a>
            </nav>

            <nav class="topnav topnav--right" aria-label="Account">
                <a class="topnav-link" href="saved.html">Saved</a>
                <a class="topnav-link is-active" href="profile.html">Profile</a>
            </nav>
        </div>
    </header>

    <main class="container page">
        <section class="page-head">
            <h1 class="page-title">Profile</h1>
            <p class="page-subtitle">A lightweight preview of a future account experience (placeholders only).</p>
        </section>

        <section class="card card--padded">
                <p class="profile-note">Nothing is saved yet — this layout previews how contact and traveler info could appear.</p>

                <div class="profile-fields">
                    <div class="field-row">
                        <label class="field">
                            <span class="field-label">Name</span>
                            <input class="field-input" type="text" name="full_name" placeholder="Jane Traveler" disabled autocomplete="off">
                        </label>
                        <label class="field">
                            <span class="field-label">Email</span>
                            <input class="field-input" type="email" name="email" placeholder="you@example.com" disabled autocomplete="off">
                        </label>
                    </div>
                    <div class="field-row">
                        <label class="field">
                            <span class="field-label">Home airport</span>
                            <input class="field-input" type="text" name="home_airport" placeholder="EWR" disabled autocomplete="off">
                        </label>
                        <label class="field">
                            <span class="field-label">Known Traveler / TSA PreCheck</span>
                            <input class="field-input" type="text" name="ktn" placeholder="Optional — not stored yet" disabled autocomplete="off">
                        </label>
                    </div>
                </div>
        </section>
    </main>
</body>
</html>
